<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
      <input type="text" id="display" class="display" placeholder="0">
        <div id="key">
            <input id="box" type="button" value="AC" class="btn" onclick="cleardisplay('AC')">
            <input id="box" type="button" value="DEL" class="btn" onclick="deletlist('DEL')">
            <input id="box" type="button" value="%" class="btn" onclick="apeareddisplay('%')">
            <input id="box" type="button" value="/" class="btn" onclick="apeareddisplay('/')">

            <input type="button" value="7" class="btn" onclick="apeareddisplay('7')">
            <input type="button" value="8" class="btn" onclick="apeareddisplay('8')">
            <input type="button" value="9" class="btn" onclick="apeareddisplay('9')">
            <input id="box" type="button" value="*" class="btn" onclick="apeareddisplay('*')">

            <input type="button" value="4" class="btn" onclick="apeareddisplay('4')">
            <input type="button" value="5" class="btn" onclick="apeareddisplay('5')">
            <input type="button" value="6" class="btn" onclick="apeareddisplay('6')">
            <input id="box" type="button" value="-" class="btn" onclick="apeareddisplay('-')">

            <input type="button" value="1" class="btn" onclick="apeareddisplay('1')">
            <input type="button" value="2" class="btn" onclick="apeareddisplay('2')">
            <input type="button" value="3" class="btn" onclick="apeareddisplay('3')">
            <input id="box" type="button" value="+" class="btn" onclick="apeareddisplay('+')">

            <input type="button" value="00" class="btn" onclick="apeareddisplay('00')">
            <input type="button" value="0" class="btn" onclick="apeareddisplay('0')">
            <input type="button" value="." class="btn" onclick="apeareddisplay('.')">
            <input id="box2" type="button" value="=" class="btn" onclick="apeareddisplay('=')">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
